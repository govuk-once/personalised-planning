[project]
name = "personalised-planning"
version = "0.1.0"
description = "Application for helping users to plan through complex life situations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Government Digital Service"},
]
keywords = ["govuk", "gds", "experimentation", "aws", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pre-commit>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/govuk-once/personalised-planning"
Repository = "https://github.com/govuk-once/personalised-planning"
Issues = "https://github.com/govuk-once/personalised-planning/issues"
Changelog = "https://github.com/govuk-once/personalised-planning/releases"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.21",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # Ignore line-too-long errors

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv.workspace]
members = [
    "scripts/evaluation/plan-generation",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]
