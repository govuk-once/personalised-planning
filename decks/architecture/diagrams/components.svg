.8" marker-end="url(#a)"/><rect x="240" y="10" width="200" height="330" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="254" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">Backend, Lambdas</text><rect x="255" y="50" width="170" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="340.0" y="76.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Worker handler</text><text x="340.0" y="91.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">claims and runs job</text><line x1="355" y1="106" x2="355" y2="158" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="361" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">claims,</text><text x="361" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">saves reply</text><rect x="285" y="160" width="140" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="355.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Job store</text><text x="355.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">job records</text><line x1="355" y1="270" x2="355" y2="218" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="361" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">saves job,</text><text x="361" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">reads job</text><rect x="255" y="270" width="170" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="340.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Api handler</text><text x="340.0" y="311.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">start, get job</text><line x1="270" y1="270" x2="270" y2="108" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="276" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">starts</text><line x1="425" y1="188" x2="468" y2="188" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="470" y="160" width="100" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="520.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">DynamoDB</text><text x="520.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">jobs table</text><line x1="425" y1="78" x2="613" y2="78" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="520" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">invokes</text><rect x="600" y="10" width="200" height="330" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="614" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">AgentCore Runtime</text><rect x="615" y="50" width="170" height="56" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><t