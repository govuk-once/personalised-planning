<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 350" preserveAspectRatio="xMidYMid meet"><title>Inside the frontend, pages and a poller in the browser call server actions, which use a backend client to invoke the Api Lambda. In the backend, the Api handler saves and reads jobs through the job store in DynamoDB and starts the Worker handler, which claims the job, invokes the agent and saves the reply. On AgentCore Runtime, each agent's entry point passes the request to its chat or plan logic and then to an agent runner, which calls Claude on Bedrock and the service graph's MCP tools through Gateway. The tools use a graph engine over the rules and data</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
