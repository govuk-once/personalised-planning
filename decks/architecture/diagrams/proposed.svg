 font-weight="400" fill="#fff" text-anchor="middle">new, API Gateway</text><rect x="310" y="40" width="140" height="52" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="380.0" y="64.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Identity provider</text><text x="380.0" y="79.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">new, signs users in</text><line x1="380" y1="190" x2="380" y2="94" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="386" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">checks token</text><line x1="450" y1="218" x2="478" y2="110" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><line x1="450" y1="218" x2="491" y2="421" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="480" y="10" width="470" height="170" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="494" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">Chat V2 agent/orchestrator</text><text x="560" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#505A5F" text-anchor="middle">tbc</text><rect x="765" y="45" width="170" height="52" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="850.0" y="69.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Conversation agent</text><text x="850.0" y="84.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">asks the next question</text><line x1="590" y1="180" x2="590" y2="243" stroke="#0B0C0C" stroke-width="1.8