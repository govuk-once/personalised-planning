<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 472" preserveAspectRatio="xMidYMid meet"><title>Proposed: users reach the service through the web frontend or a new GOV.UK app in React Native. Both call a new public API, which checks the user's token with an identity provider. The API routes to two separate parts. A Chat V2 agent or orchestrator holds the conversation agent; how it is built is to be confirmed. When the user presses Start plan, it sends the context to a new generate plan endpoint. The plans backend also has a new get plans endpoint, a plan worker and a new plan store kept by user, and calls the planner agent. Both agents call Claude on Bedrock, and reach the service graph through AgentCore Gateway</title><defs>
