<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 248" preserveAspectRatio="xMidYMid meet"><title>The user describes their situation and the conversation agent asks up to five questions to gather context. When it judges the conversation complete, it sums up the situation and the facts collected. When the user presses Start plan, these go to the planner agent, which queries the service graph and returns a plan of steps and tasks. Both agents call Claude on Bedrock and use the service graph</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#0B0C0C"/></marker></defs><g transform="translate(0,38)"><rect x="10" y="70" width="110" height="64" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="65.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">User</text><text x="65.0" y="115.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">describes situation</text><line x1="120" y1="102" x2="148" y2="102" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="150" y="70" width="150" height="64" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="225.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Conversation agent</text><text x="225.0" y="115.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">gathers context</text><line x1="225" y1="134" x2="225" y2="180" stroke="#0B0C0C" stroke-width="1.8"/><line x1="225" y1="180" x2="65" y2="180" stroke="#0B0C0C" stroke-width="1.8"/><line x1="65" y1="180" x2="65" y2="136" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="145" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">asks the next question, at most 5</text><line x1="300" y1="102" x2="328" y2="102" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="330" y="70" width="150" height="64" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="405.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Situation and facts</text><text x="405.0" y="115.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">when judged complete</text><line x1="480" y1="102" x2="508" y2="102" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="495" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">user presses</text><text x="495" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">Start plan</text><line x1="495" y1="150" x2="495" y2="108" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="3 3"/><rect x="510" y="70" width="140" height="64" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="580.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Planner agent</text><text x="580.0" y="115.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">builds the plan</text><line x1="650" y1="102" x2="678" y2="102" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="680" y="70" width="110" height="64" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="735.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Plan</text><text x="735.0" y="115.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">steps and tasks</text><rect x="250" y="-28" width="160" height="46" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="330.0" y="-7.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Claude</text><text x="330.0" y="8.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">on Bedrock</text><rect x="430" y="-28" width="160" height="46" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="510.0" y="-7.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Service graph</text><text x="510.0" y="8.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">MCP via Gateway</text><line x1="225" y1="70" x2="225" y2="48" stroke="#0B0C0C" stroke-width="1.8"/><line x1="580" y1="70" x2="580" y2="48" stroke="#0B0C0C" stroke-width="1.8"/><line x1="225" y1="48" x2="580" y2="48" stroke="#0B0C0C" stroke-width="1.8"/><line x1="330" y1="48" x2="330" y2="20" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="338" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">model</text><line x1="510" y1="48" x2="510" y2="20" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="518" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">tools</text></g></svg>
