<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" preserveAspectRatio="xMidYMid meet"><rect width="100%" height="100%" fill="#F8F8F8"/><title>The user's browser talks to the Next.js frontend on Amplify. The frontend starts jobs and polls the Api Lambda, which saves each job in a DynamoDB table and starts the Worker Lambda. The Worker calls the conversation or planner agent on AgentCore Runtime and saves the reply to the job. The agents call Claude on Bedrock and use the service graph MCP server through AgentCore Gateway</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#0B0C0C"/></marker></defs><rect x="10" y="60" width="100" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="60.0" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">User</text><text x="60.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">web browser</text><line x1="110" y1="88" x2="128" y2="88" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="130" y="60" width="140" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="200.0" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Frontend</text><text x="200.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">Next.js on Amplify</text><line x1="270" y1="88" x2="358" y2="88" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="305" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">starts, polls</text><rect x="345" y="10" width="175" height="340" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="359" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">Backend</text><rect x="360" y="60" width="140" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="430.0" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Api</text><text x="430.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">Lambda</text><line x1="395" y1="116" x2="395" y2="168" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="401" y="147" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">saves job</text><rect x="370" y="170" width="120" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="430.0" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">DynamoDB</text><text x="430.0" y="211.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">jobs table</text><line x1="395" y1="270" x2="395" y2="228" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="401" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">saves reply</text><rect x="360" y="270" width="140" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="430.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Worker</text><text x="430.0" y="311.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">Lambda</text><line x1="492" y1="116" x2="492" y2="268" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="488" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="end">starts</text><line x1="500" y1="298" x2="558" y2="298" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="540" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">calls</text><rect x="560" y="170" width="270" height="180" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="574" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">AgentCore Runtime</text><rect x="580" y="205" width="230" height="56" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="695.0" y="231.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Conversation agent</text><text x="695.0" y="246.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">asks the next question</text><rect x="580" y="278" width="230" height="56" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="695.0" y="304.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Planner agent</text><text x="695.0" y="319.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">builds the plan</text><rect x="560" y="60" width="100" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="610.0" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Claude</text><text x="610.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">on Bedrock</text><line x1="620" y1="170" x2="620" y2="118" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="626" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">model</text><rect x="675" y="60" width="95" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="722.5" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Gateway</text><text x="722.5" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">AgentCore</text><line x1="722" y1="170" x2="722" y2="118" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><text x="728" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="start">tools</text><line x1="770" y1="88" x2="798" y2="88" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="800" y="60" width="125" height="56" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="862.5" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Service graph</text><text x="862.5" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">MCP server, Lambda</text></svg>
