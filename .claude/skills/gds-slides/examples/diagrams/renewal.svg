<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><title>Apply online, the service checks against its records, and the permit is sent the same day</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#0B0C0C"/></marker></defs><rect x="110" y="10" width="180" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="200.0" y="38.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Apply</text><text x="200.0" y="53.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">online, about 5 minutes</text><line x1="200" y1="70" x2="200" y2="108" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="20" y="100" width="360" height="120" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="34" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">Done by the service</text><rect x="110" y="135" width="180" height="60" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="200.0" y="163.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Check</text><text x="200.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">against records</text><line x1="200" y1="220" x2="200" y2="238" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="110" y="240" width="180" height="50" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="200.0" y="263.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Permit</text><text x="200.0" y="278.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">sent the same day</text></svg>
