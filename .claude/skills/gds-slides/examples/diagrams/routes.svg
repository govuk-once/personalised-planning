<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" preserveAspectRatio="xMidYMid meet"><title>Before: paper form, post and a manual check. Now: an online form and an automatic check. Both end with the same permit</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#0B0C0C"/></marker></defs><text x="10" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0C0C" text-anchor="start">Before</text><text x="10" y="155" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0C0C" text-anchor="start">Now</text><rect x="90" y="5" width="140" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="160.0" y="33.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Paper form</text><text x="160.0" y="48.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">filled in by hand</text><line x1="230" y1="35" x2="258" y2="35" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="260" y="5" width="140" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="330.0" y="33.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Post</text><text x="330.0" y="48.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">up to a week</text><line x1="400" y1="35" x2="428" y2="35" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="430" y="5" width="140" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="500.0" y="33.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Manual check</text><text x="500.0" y="48.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">two weeks</text><line x1="570" y1="35" x2="598" y2="78" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="90" y="120" width="140" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="160.0" y="148.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Online form</text><text x="160.0" y="163.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">about 5 minutes</text><line x1="230" y1="150" x2="258" y2="150" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="260" y="120" width="310" height="60" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="415.0" y="148.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0C0C" text-anchor="middle">Automatic check</text><text x="415.0" y="163.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0B0C0C" text-anchor="middle">against the service's records</text><line x1="570" y1="150" x2="598" y2="108" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="600" y="60" width="160" height="64" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="680.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Permit</text><text x="680.0" y="105.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">same result</text></svg>
