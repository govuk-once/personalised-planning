<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" preserveAspectRatio="xMidYMid meet"><title>An outline is built by build.py into a PowerPoint file, for editing and collaborating, and an HTML file, for sharing. To change the deck, change the outline and rebuild both</title><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#0B0C0C"/></marker></defs><rect x="20" y="80" width="170" height="80" rx="6" fill="#04084A" stroke="#04084A" stroke-width="1.5"/><text x="105.0" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Outline</text><text x="105.0" y="138.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">one Markdown file</text><line x1="190" y1="120" x2="278" y2="120" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="280" y="95" width="150" height="50" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="355.0" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0C0C" text-anchor="middle">build.py</text><text x="355.0" y="136.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0B0C0C" text-anchor="middle">one command</text><line x1="430" y1="120" x2="508" y2="78" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><line x1="430" y1="120" x2="508" y2="178" stroke="#0B0C0C" stroke-width="1.8" marker-end="url(#a)"/><rect x="490" y="8" width="262" height="224" rx="10" fill="none" stroke="#505A5F" stroke-width="1.5" stroke-dasharray="6 5"/><text x="504" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#505A5F" text-anchor="start">decks/&lt;name&gt;/</text><rect x="510" y="40" width="225" height="76" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="622.5" y="76.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B0C0C" text-anchor="middle">PowerPoint</text><text x="622.5" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B0C0C" text-anchor="middle">edit and collaborate</text><rect x="510" y="140" width="225" height="76" rx="6" fill="#fff" stroke="#0B0C0C" stroke-width="1.5"/><text x="622.5" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B0C0C" text-anchor="middle">HTML</text><text x="622.5" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B0C0C" text-anchor="middle">share in one file</text><line x1="622" y1="232" x2="622" y2="252" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="622" y1="252" x2="105" y2="252" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="105" y1="252" x2="105" y2="164" stroke="#0B0C0C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="365" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0B0C0C" text-anchor="middle">Change the outline, rebuild both</text></svg>
